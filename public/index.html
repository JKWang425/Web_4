<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CITY CAFE 價格觀測站</title>
    <!-- 引入 Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        /* 溫暖咖啡色系自訂樣式 */
        :root {
            --coffee-dark: #4A3018;   /* 深焙黑咖啡 */
            --coffee-primary: #6F4E37; /* 經典咖啡色 */
            --coffee-light: #C19A6B;  /* 拿鐵色 */
            --coffee-bg: #FDFBF7;     /* 奶泡白背景 */
        }
        body {
            background-color: var(--coffee-bg);
            color: var(--coffee-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background-color: var(--coffee-primary);
        }
        .btn-coffee {
            background-color: var(--coffee-primary);
            border-color: var(--coffee-primary);
            color: white;
            transition: all 0.3s;
        }
        .btn-coffee:hover {
            background-color: var(--coffee-dark);
            border-color: var(--coffee-dark);
            color: white;
        }
        .card {
            border: 1px solid rgba(193, 154, 107, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-radius: 12px;
        }
        .table-coffee thead {
            background-color: var(--coffee-light);
            color: white;
        }
    </style>
</head>
<body>
    <!-- 導覽列 -->
    <nav class="navbar navbar-dark mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fw-bold"><i class="bi bi-cup-hot-fill me-2"></i>CITY CAFE 價格觀測站</span>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row text-center mb-4">
            <div class="col">
                <p class="lead text-muted">追蹤 7-11 CITY CAFE 商品價格變化，觀察物價波動趨勢</p>
            </div>
        </div>

        <div class="row justify-content-center">
            <!-- 新增紀錄表單 -->
            <div class="col-md-4 mb-4">
                <div class="card h-100">
                    <div class="card-header bg-white text-center py-3 border-bottom-0">
                        <h5 class="card-title mb-0 fw-bold"><i class="bi bi-plus-circle me-2"></i>新增價格紀錄</h5>
                    </div>
                    <div class="card-body">
                        <form id="priceForm">
                            <div class="mb-3">
                                <label for="date" class="form-label text-muted small fw-bold">日期</label>
                                <input type="date" class="form-control form-control-lg bg-light" id="date" name="record_date" required>
                            </div>
                            <div class="mb-3">
                                <label for="name" class="form-label text-muted small fw-bold">商品名稱</label>
                                <input type="text" class="form-control form-control-lg bg-light" id="name" name="item_name" list="coffeeOptions" placeholder="請選擇或手動輸入..." autocomplete="off" required>
                                <datalist id="coffeeOptions">
                                    <option value="特選美式咖啡大杯"></option>
                                    <option value="特選拿鐵大杯"></option>
                                    <option value="精品美式小杯"></option>
                                    <option value="精品美式中杯"></option>
                                    <option value="精品美式大杯"></option>
                                    <option value="精品拿鐵小杯"></option>
                                    <option value="精品拿鐵中杯"></option>
                                    <option value="精品拿鐵大杯"></option>
                                </datalist>
                            </div>
                            <div class="mb-4">
                                <label for="price" class="form-label text-muted small fw-bold">價格（元）</label>
                                <div class="input-group input-group-lg">
                                    <span class="input-group-text bg-light border-end-0">$</span>
                                    <input type="number" class="form-control bg-light border-start-0 ps-0" id="price" name="price" min="1" placeholder="輸入價格" required>
                                </div>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-coffee btn-lg"><i class="bi bi-send-fill me-2"></i>儲存紀錄</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- 歷史紀錄表格 -->
            <div class="col-md-8 mb-4">
                <div class="card h-100">
                    <div class="card-header bg-white py-3 border-bottom-0 d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0 fw-bold text-nowrap"><i class="bi bi-clock-history me-2"></i>歷史價格紀錄</h5>
                        <div class="input-group w-50">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-search"></i></span>
                            <input type="text" id="searchInput" class="form-control bg-light border-start-0" placeholder="搜尋品項或日期...">
                        </div>
                    </div>
                    <div class="card-body p-0 table-responsive">
                        <table class="table table-hover table-coffee mb-0 align-middle text-center">
                            <thead>
                                <tr>
                                    <th class="py-3">紀錄日期</th>
                                    <th class="py-3">品項名稱</th>
                                    <th class="py-3">價格</th>
                                    <th class="py-3">操作</th>
                                </tr>
                            </thead>
                            <tbody id="priceHistoryBody">
                                <!-- 歷史紀錄將在此處渲染 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Toast 提示元件 -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header" id="toastHeader">
                <i class="bi bi-info-circle-fill me-2"></i>
                <strong class="me-auto" id="toastTitle">系統提示</strong>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body fw-bold" id="toastMessage">
                操作成功
            </div>
        </div>
    </div>

    <!-- 引入 Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- JavaScript 邏輯 (整合了原 app.js) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const priceForm = document.getElementById('priceForm');
            const priceHistoryBody = document.getElementById('priceHistoryBody');
            const searchInput = document.getElementById('searchInput');
            
            // 初始化 Toast 元件
            const toastEl = document.getElementById('liveToast');
            const toast = new bootstrap.Toast(toastEl);
            const toastTitle = document.getElementById('toastTitle');
            const toastMessage = document.getElementById('toastMessage');
            const toastHeader = document.getElementById('toastHeader');

            // 顯示 Toast 函式
            function showToast(type, title, message) {
                toastTitle.textContent = title;
                toastMessage.textContent = message;
                if(type === 'success') {
                    toastHeader.className = 'toast-header text-white bg-success';
                } else {
                    toastHeader.className = 'toast-header text-white bg-danger';
                }
                toast.show();
            }

            // 載入並渲染歷史紀錄
            async function loadPrices(searchQuery = '') {
                try {
                    const url = searchQuery ? `/api/prices?search=${encodeURIComponent(searchQuery)}` : '/api/prices';
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('無法取得資料');
                    const data = await response.json();
                    
                    priceHistoryBody.innerHTML = '';
                    data.forEach(item => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="text-muted">${item.record_date}</td>
                            <td><span class="badge bg-light text-dark border border-secondary px-3 py-2">${item.item_name}</span></td>
                            <td class="fw-bold text-danger fs-5">$${item.price}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-danger delete-btn" data-id="${item.id}" title="刪除"><i class="bi bi-trash"></i></button>
                            </td>
                        `;
                        priceHistoryBody.appendChild(tr);
                    });
                } catch (error) {
                    console.error('Error:', error);
                }
            }

            // 處理刪除紀錄 (事件代理)
            priceHistoryBody.addEventListener('click', async (e) => {
                const deleteBtn = e.target.closest('.delete-btn');
                if (deleteBtn) {
                    const id = deleteBtn.dataset.id;
                    if (!confirm('確定要刪除這筆紀錄嗎？')) return;
                    
                    try {
                        const response = await fetch(`/api/prices/${id}`, { method: 'DELETE' });
                        if (response.ok) {
                            showToast('success', '刪除成功', '紀錄已成功移除！');
                            loadPrices(searchInput.value); // 保持當前的搜尋狀態
                        } else {
                            // 檢查伺服器回傳的是不是 JSON
                            const contentType = response.headers.get("content-type");
                            if (contentType && contentType.includes("application/json")) {
                                const errData = await response.json();
                                throw new Error(errData.error || '刪除失敗');
                            } else {
                                throw new Error(`伺服器回傳了錯誤 (HTTP ${response.status})，請確認伺服器是否有重新啟動。`);
                            }
                        }
                    } catch (error) {
                        showToast('danger', '刪除失敗', error.message || '刪除紀錄時發生錯誤。');
                        console.error('Error:', error);
                    }
                }
            });

            // 處理搜尋輸入 (即時搜尋)
            searchInput.addEventListener('input', (e) => {
                loadPrices(e.target.value);
            });

            // 處理表單送出
            priceForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const formData = {
                    record_date: document.getElementById('date').value,
                    item_name: document.getElementById('name').value,
                    price: Number(document.getElementById('price').value)
                };

                try {
                    const response = await fetch('/api/prices', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });

                    if (response.ok) {
                        showToast('success', '新增成功', '價格紀錄已成功加入資料庫！');
                        priceForm.reset();
                        document.getElementById('date').valueAsDate = new Date(); // 重置後依舊維持今天日期
                        loadPrices(searchInput.value);
                    } else {
                        // 檢查伺服器回傳的是不是 JSON
                        const contentType = response.headers.get("content-type");
                        if (contentType && contentType.includes("application/json")) {
                            const errData = await response.json();
                            throw new Error(errData.error || '新增失敗');
                        } else {
                            throw new Error(`伺服器回傳了錯誤 (HTTP ${response.status})，請確認伺服器是否有重新啟動。`);
                        }
                    }
                } catch (error) {
                    showToast('danger', '新增失敗', error.message || '新增紀錄時發生錯誤，請稍後再試。');
                    console.error('Error:', error);
                }
            });

            // 畫面載入時：將日期預設為今天，並讀取資料
            document.getElementById('date').valueAsDate = new Date();
            loadPrices();
        });
    </script>
</body>
</html>
